name: CI

on:
  push:
    branches: [ main ]   # يشتغل مع كل تعديل على الفرع الرئيسي
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ تحميل الكود
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ تثبيت Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3️⃣ تثبيت الأدوات (ESLint + Stylelint + HTMLHint)
      - name: Install dependencies
        run: |
          npm install eslint stylelint htmlhint --save-dev

      # 4️⃣ فحص JavaScript
      - name: Run ESLint
        run: npx eslint "**/*.js"

      # 5️⃣ فحص CSS
      - name: Run Stylelint
        run: npx stylelint "**/*.css"

      # 6️⃣ فحص HTML
      - name: Run HTMLHint
        run: npx htmlhint "**/*.html"
